<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · Administración</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 40px 35px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-box {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            margin-bottom: 18px;
        }
        .logo-box img { max-width: 85%; max-height: 85%; object-fit: contain; }
        h1 { font-size: 22px; color: #333; margin-bottom: 5px; }
        p.sub { font-size: 14px; color: #777; margin-bottom: 25px; }
        label { display: block; text-align: left; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #555; }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #007bff; }
        button {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #218838; }
        button:disabled { background: #8bc9a0; cursor: not-allowed; }
        #mensaje {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        #mensaje.error { color: #dc3545; }
        #mensaje.ok { color: #28a745; }
        .nota { margin-top: 18px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <img src="launch_logo.png" alt="Logo Iglesia">
        </div>
        <h1>Panel de Administración</h1>
        <p class="sub">Ingresa con tu correo y contraseña</p>

        <form id="formLogin">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" placeholder="tu@correo.com" required autocomplete="username">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">

            <button type="submit" id="btnLogin">Iniciar Sesión</button>
        </form>

        <div id="mensaje"></div>
        <p class="nota">Acceso restringido. Solo personal autorizado.</p>
    </div>

<script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('btnLogin');
        const mensaje = document.getElementById('mensaje');
        mensaje.textContent = '';
        mensaje.className = '';
        btn.disabled = true;
        btn.textContent = 'Entrando...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                mensaje.textContent = '¡Bienvenido! Redirigiendo...';
                mensaje.className = 'ok';
                // El servidor decide el destino según rol y permisos
                window.location.href = '/';
            } else {
                mensaje.textContent = data.error || 'No se pudo iniciar sesión.';
                mensaje.className = 'error';
            }
        } catch (error) {
            mensaje.textContent = 'Error de conexión con el servidor.';
            mensaje.className = 'error';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Iniciar Sesión';
        }
    });
</script>
</body>
</html>
